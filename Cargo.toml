[package]
name = "rusty-fps-sketch"
version = "0.1.0"
edition = "2021"
description = "A tiny touch-friendly raycast FPS prototype in Rust"
license = "MIT"

[dependencies]
macroquad = "0.4"

[package.metadata.android]
package_name = "com.vantalauncher.marikinafps"
label = "Marikina FPS"
android_version = 30
min_sdk_version = 26
target_sdk_version = 30
build_targets = ["aarch64-linux-android"]
fullscreen = true

[profile.release]
lto = true
opt-level = 2
strip = true
