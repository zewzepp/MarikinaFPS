[package]
name = "marikinafps"
version = "0.1.0"
edition = "2021"
description = "A touch-friendly third-person city shooter in Rust (macroquad)"
license = "MIT"

[dependencies]
macroquad = "0.4"

[package.metadata.android]
package_name = "com.vantalauncher.marikinafps"
label = "Marikina FPS"
android_version = 30
min_sdk_version = 26
target_sdk_version = 30
build_targets = ["aarch64-linux-android"]
fullscreen = true

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "sensorLandscape"

[profile.release]
lto = false
opt-level = 3
strip = false
