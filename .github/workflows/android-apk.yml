name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository may contain the source project as an uploaded ZIP
      # instead of expanded files. Prefer that archive when one is present.
      - name: Extract uploaded project ZIP (when present)
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' ! -path './.git/*' | sort | head -n 1 || true)"
          if [[ -n "$ZIP_FILE" ]]; then
            echo "Using source archive: $ZIP_FILE"
            rm -rf .build-input
            mkdir -p .build-input
            unzip -q "$ZIP_FILE" -d .build-input
            CARGO_FILE="$(find .build-input -type f -name Cargo.toml -not -path '*/target/*' | head -n 1)"
            if [[ -z "$CARGO_FILE" ]]; then
              echo 'No Cargo.toml found inside uploaded ZIP.' >&2
              exit 1
            fi
            PROJECT_DIR="$(dirname "$CARGO_FILE")"
            rsync -a --exclude='.git' --exclude='.build-input' --exclude='*.zip' "$PROJECT_DIR"/ ./
          fi
          test -f Cargo.toml || { echo 'Cargo.toml is missing after source preparation.' >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK packages
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3" "ndk;27.2.12479018"
      - name: Set Android NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-quad-apk
        run: cargo install --git https://github.com/not-fl3/cargo-quad-apk.git --rev d411c8fe1c08339e46d7dc6b40ac04ea5e3a01b6 --locked
      - name: Build release APK
        run: cargo quad-apk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: marikina-fps-android-apk
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
